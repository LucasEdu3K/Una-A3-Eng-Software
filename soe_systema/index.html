<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOE System - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Login | Requisitos: RF01, RNF01, RNF04 -->
  <div class="pagina">
    <main class="conteudo">
      <img class="logo" src="assets/logo.png" alt="SOE System">
      <form id="form-login" class="form">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" placeholder="aluno@email.com" required>
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" placeholder="••••••" required>
        <button type="submit" class="botao">Entrar</button>
        <a class="link-centro" href="cadastro.html">Cadastrar</a>
      </form>
    </main>
  </div>
</body>
</html>
