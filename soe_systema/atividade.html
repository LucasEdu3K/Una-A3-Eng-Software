<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOE System - Nova atividade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Nova atividade | Requisitos: RF03, RF07, RNF01 -->
  <div class="pagina">
    <header class="barra-topo">
      <a class="voltar" href="menu.html">Voltar</a>
      <span class="mini-logo">SOE</span>
    </header>
    <h1 class="faixa-titulo">Nova atividade</h1>
    <main class="conteudo">
      <form id="form-atividade" class="form">
        <label>Tipo</label>
        <select>
          <option>Tarefa</option>
          <option>Trabalho</option>
          <option>Prova</option>
        </select>
        <label>Título</label>
        <input type="text" placeholder="Digite o título" required>
        <label>Disciplina</label>
        <select>
          <option>Selecione</option>
          <option>Cálculo I</option>
          <option>Banco de Dados</option>
          <option>Eng. de Software</option>
        </select>
        <label>Prazo</label>
        <input type="date" required>
        <button type="submit" class="botao pequeno">Salvar</button>
      </form>
    </main>
  </div>
</body>
</html>
