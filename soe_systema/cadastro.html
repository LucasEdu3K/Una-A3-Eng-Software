<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOE System - Dados do usuário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Dados do usuário | Requisitos: RF01, RNF04 -->
  <div class="pagina">
    <header class="barra-topo">
      <a class="voltar" href="index.html">Voltar</a>
      <span class="mini-logo">SOE</span>
    </header>
    <h1 class="faixa-titulo">Dados do usuário</h1>
    <main class="conteudo">
      <form id="form-cadastro" class="form">
        <input type="text" placeholder="NOME" required>
        <input type="email" id="cadastro-email" placeholder="E-MAIL" required>
        <input type="text" placeholder="CURSO">
        <input type="text" placeholder="INSTITUIÇÃO">
        <input type="password" id="cadastro-senha" placeholder="CADASTRAR SENHA" required>
        <button type="submit" class="botao pequeno">Salvar</button>
      </form>
    </main>
  </div>
</body>
</html>
